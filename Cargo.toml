[package]
# crates.io has had an unrelated `rash` — a file hasher — since 2018, and
# `rash_core` and `rash-shell` are live in the same namespace. Only the package
# is renamed: the binary and the library both keep the short name.
name = "rash-ssh"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"   # let-chains
description = "Rust Auto SSH — start an ssh session or tunnel, monitor it, and restart it when it dies or stops passing traffic"
repository = "https://github.com/tralireza/rash"
license = "MIT"
keywords = ["ssh", "tunnel", "autossh", "supervisor"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = []
# The fake-ssh stand-in used by the end-to-end tests. Off by default so that no
# ordinary build compiles it; `cargo test --all-features` is the entry point
# that runs the e2e suite.
test-harness = []

# Without this the library would follow the package to `rash_ssh`, and the six
# files that say `use rash::…` would all have to change for no reason a reader
# could guess at.
[lib]
name = "rash"

[[bin]]
name = "rash"
path = "src/main.rs"

# An example rather than a second `[[bin]]`, because crates.io lists every
# `[[bin]]` a package declares and ignores `required-features` when it does. So
# the crate page told every reader that `cargo install rash-ssh` would put a
# fake ssh server on their PATH, which was never true — Cargo honours
# `required-features` even where the page does not. `cargo install` never
# installs an example, and an example is not in that list to begin with.
[[example]]
name = "fake-ssh"
path = "tests/bin/fake_ssh.rs"
required-features = ["test-harness"]

[profile.release]
# Drop debug info but keep the symbol table: a released binary has no use for
# the former, and a backtrace out of a wedged supervisor is worth much more
# with function names than without. `strip = true` would take both.
strip = "debuginfo"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Only for escaping the JSON log sink; the messages are ours, but they carry
# paths and OS error strings that can hold quotes and backslashes.
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = [
  "rt",
  "macros",
  "process",
  "net",
  "signal",
  "time",
  "io-util",
] }

[dev-dependencies]
# Already in the tree; the tests use it to check the JSON log sink for real
# rather than by string matching.
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# The libc call sites are few and each is justified in a `SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
